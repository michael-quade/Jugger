name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * MON'   # Monday noon UTC — well within the 7-day inactivity window
  workflow_dispatch:          # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # Trim any accidental whitespace/newlines from secret values
          SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          SUPABASE_KEY=$(printf '%s' "$SUPABASE_KEY" | tr -d '[:space:]')
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secret is not configured on this repository."
            exit 1
          fi
          echo "URL length: ${#SUPABASE_URL}, starts with: ${SUPABASE_URL:0:8}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase responded with HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "Network failure — could not reach Supabase"
            exit 1
          fi
          echo "Ping successful"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
